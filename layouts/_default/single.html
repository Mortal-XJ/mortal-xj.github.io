{{ define "main" }}
<article class="single-post">
  <header class="post-header">
    <h1 class="post-title-single">{{ .Title }}</h1>
    {{ if ne .Type "page" }}
    <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">
      {{ .Date.Format "2006-01-02" }}
    </time>
    {{ end }}
  </header>
  <div class="post-content">
    {{ .Content }}
  </div>
  <div class="post-back">
    <a href="/">&larr; Back</a>
  </div>
</article>
{{ end }}
