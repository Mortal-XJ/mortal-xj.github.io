{{ define "main" }}
<article class="single-post">
  <header class="post-header">
    {{ with .Params.cover }}
    <img src="{{ . }}" alt="{{ $.Title }}" class="post-hero">
    {{ end }}
    <div class="post-meta-top">
      <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">
        {{ .Date.Format "2006-01-02" }}
      </time>
      {{ if ne .Type "page" }}
      <span class="post-reading-time">{{ .ReadingTime }} min read</span>
      {{ end }}
    </div>
    <h1 class="post-title-single">{{ .Title }}</h1>
    {{ with .Params.tags }}
    <div class="post-tags">
      {{ range . }}
      <a href="/tags/{{ . | urlize }}/" class="tag-link">{{ . }}</a>
      {{ end }}
    </div>
    {{ end }}
  </header>
  <div class="post-content">
    {{ .Content }}
  </div>
  <div class="post-back">
    <a href="/">&larr; Back</a>
  </div>
</article>
{{ end }}
